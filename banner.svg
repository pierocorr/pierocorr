<svg width="700" height="160" viewBox="0 0 700 160" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500&display=swap');
      .name {
        font-family: 'Cormorant Garamond', serif;
        font-size: 52px;
        fill: #ffffff;
        letter-spacing: 6px;
        opacity: 0;
        animation: fadeIn 1.8s ease-out forwards;
      }
      .sub {
        font-family: 'Cormorant Garamond', serif;
        font-size: 15px;
        fill: #8a8a8a;
        letter-spacing: 4px;
        text-transform: uppercase;
        opacity: 0;
        animation: fadeIn 1.8s ease-out 0.4s forwards;
      }
      @keyframes fadeIn {
        from { opacity: 0; transform: translateY(6px); }
        to { opacity: 1; transform: translateY(0); }
      }
    </style>
  </defs>
  <rect width="700" height="160" fill="#000000"/>
  <text x="350" y="82" text-anchor="middle" class="name">PIERO CORDOVA</text>
  <text x="350" y="112" text-anchor="middle" class="sub">Ingeniería de Sistemas · USS</text>
</svg>
